<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysioVeda - AI Physiotherapy Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem;
            height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 10px;
            margin: 0.5rem 0;
        }

        .user-message {
            background: #3498db;
            color: white;
            align-self: flex-end;
            border-radius: 15px 15px 0 15px;
        }

        .bot-message {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            align-self: flex-start;
            border-radius: 15px 15px 15px 0;
        }

        .chat-input {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 1rem;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .chat-input button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            background: #3498db;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chat-input button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .chat-input button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: linear-gradient(135deg, #9b4dca, #ff6b6b);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(155, 77, 202, 0.4);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 15px;
            margin: 0.5rem 0;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i> Back to Home
    </button>

    <div class="container">
        <header>
            <h1>AI Physiotherapy Assistant</h1>
            <p class="tagline">Ask me anything about physiotherapy exercises!</p>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    Hi! I'm your AI physiotherapy assistant. I can help you with exercise recommendations, form guidance, and answer questions about physiotherapy. How can I help you today?
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Type your question here..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" id="sendButton">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </div>

    <script>
        // Set your API key here
        const API_KEY = 'YOUR_GEMINI_API_KEY'; // Replace this with your Gemini API key

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            if (!message) return;

            // Disable input and button while processing
            userInput.disabled = true;
            document.getElementById('sendButton').disabled = true;

            // Add user message to chat
            addMessage(message, 'user');
            userInput.value = '';

            // Show typing indicator
            document.getElementById('typingIndicator').style.display = 'block';

            try {
                // Prepare the prompt to focus on physiotherapy
                const prompt = `You are a physiotherapy expert assistant. Only provide advice related to physiotherapy, exercises, and rehabilitation. If the question is not related to physiotherapy, politely redirect the user to consult appropriate medical professionals. 

User question: ${message}`;

                // Call Gemini API with error handling
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }]
                    })
                });


                if (!response.ok) {
                throw new Error(`API Error: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(`Gemini API Error: ${data.error.message}`);
                }


                let botResponse = '';
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text) {
                    botResponse = data.candidates[0].content.parts[0].text;
                } else {
                    throw new Error('Invalid response format from Gemini API');
                }

                // Hide typing indicator and add bot response
                document.getElementById('typingIndicator').style.display = 'none';
                addMessage(botResponse, 'bot');

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('typingIndicator').style.display = 'none';
                addMessage("I apologize, but I'm having trouble connecting to my knowledge base. Please check your API key and try again.", 'bot');
            }

            // Re-enable input and button
            userInput.disabled = false;
            document.getElementById('sendButton').disabled = false;
            userInput.focus();
        }

        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }


        // Focus input on page load
        window.onload = () => {
            document.getElementById('userInput').focus();
        };
    </script>
</body>
</html>
