<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Injury - PhysioVeda</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dropdown-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
            animation: fadeInUp 1s ease-out;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .dropdown-container:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: linear-gradient(135deg, #9b4dca, #ff6b6b);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(155, 77, 202, 0.3);
            overflow: hidden;
            position: relative;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #9b4dca);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .back-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(155, 77, 202, 0.5),
                       0 0 20px rgba(255, 107, 107, 0.3);
        }

        .back-btn:hover::before {
            opacity: 1;
        }

        .dropdown-container h2 {
            color: #fff;
            margin-bottom: 2rem;
            font-size: 2rem;
            background: linear-gradient(45deg, #9b4dca, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            transition: all 0.5s ease;
        }

        .dropdown-container h2:hover {
            background-position: 100% 100%;
            transform: scale(1.02);
        }

        .injury-select {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid rgba(155, 77, 202, 0.5);
            border-radius: 10px;
            margin-bottom: 2rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .injury-select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(155, 77, 202, 0.3);
            border-color: #9b4dca;
        }

        .injury-select option {
            background: #1a1c2c;
            color: #fff;
        }

        .submit-btn {
            background: linear-gradient(135deg, #9b4dca, #ff6b6b);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(155, 77, 202, 0.3);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #9b4dca);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .submit-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(155, 77, 202, 0.5),
                       0 0 20px rgba(255, 107, 107, 0.3);
        }

        .submit-btn:hover::before {
            opacity: 1;
        }

        .submit-btn:disabled {
            background: rgba(155, 77, 202, 0.2);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @keyframes buttonPulse {
            0% {
                box-shadow: 0 8px 25px rgba(155, 77, 202, 0.3);
            }
            50% {
                box-shadow: 0 15px 35px rgba(155, 77, 202, 0.5),
                           0 0 30px rgba(255, 107, 107, 0.3);
            }
            100% {
                box-shadow: 0 8px 25px rgba(155, 77, 202, 0.3);
            }
        }

        .submit-btn:not(:disabled) {
            animation: buttonPulse 2s infinite;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i> Back to Home
    </button>
    
    <div class="container">
        <div class="dropdown-container">
            <h2>Select Your Injury</h2>
            <select class="injury-select" id="injurySelect">
                <option value="">Choose a body part...</option>
                <option value="neck">Neck</option>
                <option value="shoulders">Shoulders</option>
                <option value="elbow">Elbow</option>
                <option value="wrist">Wrist</option>
                <option value="knee">Knee</option>
                <option value="ankle">Ankle</option>
            </select>
            <button class="submit-btn" id="submitBtn" disabled>Continue</button>
        </div>
    </div>

    <script>
        const injurySelect = document.getElementById('injurySelect');
        const submitBtn = document.getElementById('submitBtn');

        injurySelect.addEventListener('change', () => {
            submitBtn.disabled = !injurySelect.value;
        });

        submitBtn.addEventListener('click', () => {
            const selectedInjury = injurySelect.value;
            // Redirect to exercises page with the selected injury as a parameter
            window.location.href = `exercises.html?injury=${selectedInjury}`;
        });
    </script>
</body>
</html>
